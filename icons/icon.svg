<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#22437a"/>
      <stop offset="0.45" stop-color="#0d1a38"/>
      <stop offset="1" stop-color="#03060f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe9a6"/>
      <stop offset="0.35" stop-color="#e6c25b"/>
      <stop offset="0.7" stop-color="#c5a059"/>
      <stop offset="1" stop-color="#8a6a2c"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2c2"/>
      <stop offset="0.4" stop-color="#f0cf6e"/>
      <stop offset="1" stop-color="#a3803b"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c335e"/>
      <stop offset="1" stop-color="#070d1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e6c25b" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#e6c25b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7fa3d9" stroke-opacity="0.07" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="shieldClip">
      <path d="M512 232 L716 306 V514 C716 652 624 748 512 804 C400 748 308 652 308 514 V306 Z"/>
    </clipPath>
  </defs>

  <!-- พื้นหลัง -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#grid)"/>
  <circle cx="512" cy="512" r="360" fill="url(#glow)"/>

  <!-- วงแหวนเล็งเป้า -->
  <g fill="none" stroke="url(#gold)">
    <circle cx="512" cy="512" r="384" stroke-width="10"/>
    <circle cx="512" cy="512" r="348" stroke-width="3" stroke-opacity="0.7"/>
    <circle cx="512" cy="512" r="366" stroke-width="16" stroke-dasharray="3 22.5518" stroke-opacity="0.55"/>
  </g>
  <g fill="url(#gold)">
    <path d="M512 92 L530 132 H494 Z"/>
    <path d="M512 932 L494 892 H530 Z"/>
    <path d="M92 512 L132 494 V530 Z"/>
    <path d="M932 512 L892 530 V494 Z"/>
  </g>

  <!-- โล่ -->
  <g filter="url(#shadow)">
    <path d="M512 232 L716 306 V514 C716 652 624 748 512 804 C400 748 308 652 308 514 V306 Z" fill="url(#shield)"/>
    <g clip-path="url(#shieldClip)">
      <rect x="308" y="220" width="204" height="600" fill="#ffffff" fill-opacity="0.06"/>
      <path d="M300 230 L560 230 L380 820 L300 820 Z" fill="#ffffff" fill-opacity="0.04"/>
    </g>
    <path d="M512 232 L716 306 V514 C716 652 624 748 512 804 C400 748 308 652 308 514 V306 Z" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linejoin="round"/>
    <path d="M512 266 L686 329 V514 C686 632 608 716 512 768 C416 716 338 632 338 514 V329 Z" fill="none" stroke="#e6c25b" stroke-opacity="0.45" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- ดาว -->
  <path transform="translate(512 352)" fill="url(#goldH)"
        d="M0 -38 L11.2 -12.3 L36.1 -11.7 L16.4 4.9 L22.3 30.7 L0 17 L-22.3 30.7 L-16.4 4.9 L-36.1 -11.7 L-11.2 -12.3 Z"/>

  <!-- อักษร H -->
  <path fill="url(#goldH)" stroke="#5a4214" stroke-opacity="0.35" stroke-width="3"
        d="M408 410 H474 V496 H550 V410 H616 V430 L602 444 V614 L616 628 V648 H550 V546 H474 V648 H408 V628 L422 614 V444 L408 430 Z"/>

  <!-- บั้งยศ -->
  <g fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M444 682 L512 714 L580 682"/>
  </g>
</svg>
